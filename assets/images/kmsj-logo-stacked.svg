<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <clipPath id="stackedEmblemClip">
      <circle cx="100" cy="80" r="76" />
    </clipPath>
  </defs>

  <!-- 1. Circular Emblem -->
  <g clip-path="url(#stackedEmblemClip)">
    <rect x="20" y="0" width="53" height="160" fill="#ee972e" />
    <rect x="73" y="0" width="54" height="160" fill="#5e7cbc" />
    <rect x="127" y="0" width="53" height="160" fill="#5a448c" />
    
    <line x1="73" y1="0" x2="73" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    <line x1="127" y1="0" x2="127" y2="160" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" />
    
    <!-- Lamp -->
    <polygon points="38,76 66,76 59,48 45,48" fill="#ffffff" />
    <rect x="50" y="76" width="3.5" height="55" fill="#ffffff" />
    <rect x="43" y="130" width="17" height="3.5" rx="1.5" fill="#ffffff" />
    
    <!-- Table & Plant -->
    <rect x="63" y="112" width="74" height="4" rx="1" fill="#ffffff" />
    <rect x="71" y="116" width="3" height="28" fill="#ffffff" />
    <rect x="128" y="116" width="3" height="28" fill="#ffffff" />
    <rect x="93" y="84" width="14" height="28" rx="1.5" fill="#ffffff" />
    <path d="M100,84 L100,42" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <path d="M100,71 C90,68 88,57 100,53 C99,61 99,67 100,71 Z" fill="#ffffff" />
    <path d="M100,60 C110,57 112,46 100,42 C101,50 101,56 100,60 Z" fill="#ffffff" />
    <path d="M100,42 C95,32 105,24 100,19 C96,24 96,35 100,42 Z" fill="#ffffff" />
    
    <!-- Bookshelf -->
    <rect x="131" y="42" width="42" height="4" rx="1" fill="#ffffff" />
    <rect x="131" y="78" width="42" height="4" rx="1" fill="#ffffff" />
    <rect x="131" y="42" width="3.5" height="40" fill="#ffffff" />
    <rect x="139" y="50" width="5" height="28" rx="1" fill="#ffffff" />
    <rect x="146" y="48" width="5" height="30" rx="1" fill="#ffffff" />
    <rect x="153" y="49" width="5" height="29" rx="1" fill="#ffffff" />
    <polygon points="160,78 167,52 172,54 166,78" fill="#ffffff" />
  </g>
  <circle cx="100" cy="80" r="76" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.8" />

  <!-- 2. KMSJ Typography overlapping lower circle -->
  <text x="100" y="194" 
        text-anchor="middle"
        font-family="'Albert Sans', 'Roboto', 'Arial Black', sans-serif" 
        font-size="44" 
        font-weight="900" 
        letter-spacing="2" 
        fill="#555559">KMSJ</text>

  <!-- 3. Interiors Typography -->
  <text x="100" y="224" 
        text-anchor="middle"
        font-family="'Times New Roman', 'Georgia', serif" 
        font-size="21" 
        font-weight="700" 
        letter-spacing="2" 
        fill="#3b5998">Interiors</text>
</svg>
