<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 64" width="280" height="64">
  <defs>
    <clipPath id="hdrEmblemClip">
      <circle cx="32" cy="32" r="30" />
    </clipPath>
  </defs>

  <!-- 1. Circular 3-Stripe Emblem (Diameter: 60px) -->
  <g clip-path="url(#hdrEmblemClip)">
    <!-- Orange Stripe -->
    <rect x="2" y="2" width="20.5" height="60" fill="#ee972e" />
    <!-- Blue Stripe -->
    <rect x="22.5" y="2" width="21.5" height="60" fill="#5e7cbc" />
    <!-- Purple Stripe -->
    <rect x="44" y="2" width="20" height="60" fill="#5a448c" />
    
    <!-- Stripe Separators -->
    <line x1="22.5" y1="2" x2="22.5" y2="62" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
    <line x1="44" y1="2" x2="44" y2="62" stroke="rgba(255,255,255,0.4)" stroke-width="0.8" />
    
    <!-- Lamp -->
    <polygon points="8.5,31 18.5,31 16.2,20 10.8,20" fill="#ffffff" />
    <rect x="12.8" y="31" width="1.4" height="21" fill="#ffffff" />
    <rect x="10.2" y="51" width="6.6" height="1.4" rx="0.7" fill="#ffffff" />
    
    <!-- Table, Vase & Plant -->
    <rect x="18" y="44" width="28.5" height="1.6" rx="0.3" fill="#ffffff" />
    <rect x="21" y="45.5" width="1.1" height="11" fill="#ffffff" />
    <rect x="43.5" y="45.5" width="1.1" height="11" fill="#ffffff" />
    <rect x="29.5" y="33.5" width="5.2" height="10.5" rx="0.6" fill="#ffffff" />
    <path d="M32.1,33.5 L32.1,17.5" stroke="#ffffff" stroke-width="1.1" stroke-linecap="round" />
    <path d="M32.1,28.5 C28,27.2 27.4,23 32.1,21.8 C31.8,24.5 31.8,27 32.1,28.5 Z" fill="#ffffff" />
    <path d="M32.1,24.2 C36.2,23 36.8,18.8 32.1,17.5 C32.4,20.2 32.4,22.7 32.1,24.2 Z" fill="#ffffff" />
    <path d="M32.1,17.5 C30,13.8 33.8,10.7 32.1,8.8 C30.6,10.7 30.6,15 32.1,17.5 Z" fill="#ffffff" />
    
    <!-- Bookshelf -->
    <rect x="45.5" y="17" width="16.5" height="1.5" rx="0.3" fill="#ffffff" />
    <rect x="45.5" y="31" width="16.5" height="1.5" rx="0.3" fill="#ffffff" />
    <rect x="45.5" y="17" width="1.4" height="15.5" fill="#ffffff" />
    <rect x="48.8" y="20" width="2" height="11" rx="0.3" fill="#ffffff" />
    <rect x="51.6" y="19.4" width="2" height="11.6" rx="0.3" fill="#ffffff" />
    <rect x="54.4" y="19.7" width="2" height="11.3" rx="0.3" fill="#ffffff" />
    <polygon points="57.1,31 59.9,21.2 61.9,21.8 59.4,31" fill="#ffffff" />
  </g>
  <circle cx="32" cy="32" r="30" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="1.2" />

  <!-- 2. Typography: KMSJ INTERIORS -->
  <g transform="translate(74, 0)">
    <!-- KMSJ in Bold Architectural Charcoal -->
    <text x="0" y="33" 
          font-family="'Albert Sans', 'Roboto', 'Arial Black', sans-serif" 
          font-size="29" 
          font-weight="900" 
          letter-spacing="2" 
          fill="#44484f">KMSJ</text>
    
    <!-- INTERIORS in Refined Royal Accent Blue -->
    <text x="1.5" y="52" 
          font-family="'Times New Roman', 'Georgia', serif" 
          font-size="14.5" 
          font-weight="700" 
          letter-spacing="3.8" 
          fill="#3b5998">INTERIORS</text>
  </g>
</svg>
