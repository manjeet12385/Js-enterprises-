<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <clipPath id="emblemClip">
      <circle cx="100" cy="100" r="98" />
    </clipPath>
  </defs>
  
  <g clip-path="url(#emblemClip)">
    <!-- Left Stripe: Warm Amber Orange -->
    <rect x="0" y="0" width="67" height="200" fill="#ee972e" />
    
    <!-- Center Stripe: Architectural Soft Blue -->
    <rect x="67" y="0" width="70" height="200" fill="#5e7cbc" />
    
    <!-- Right Stripe: Rich Regal Purple -->
    <rect x="137" y="0" width="63" height="200" fill="#5a448c" />
    
    <!-- Stripe Separators -->
    <line x1="67" y1="0" x2="67" y2="200" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" />
    <line x1="137" y1="0" x2="137" y2="200" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" />
    
    <!-- 1. LEFT SECTION: Designer Lamp -->
    <!-- Lamp Shade -->
    <polygon points="22,96 56,96 48,60 30,60" fill="#ffffff" />
    <!-- Lamp Stand Pole -->
    <rect x="37" y="96" width="4.5" height="70" fill="#ffffff" />
    <!-- Lamp Base -->
    <rect x="29" y="164" width="20.5" height="4.5" rx="2" fill="#ffffff" />
    
    <!-- 2. CENTER SECTION: Table, Vase & Plant Sprout -->
    <!-- Console Table Surface -->
    <rect x="54" y="138" width="94" height="5" rx="1" fill="#ffffff" />
    <!-- Left Leg -->
    <rect x="64" y="143" width="3.5" height="36" fill="#ffffff" />
    <!-- Right Leg -->
    <rect x="138" y="143" width="3.5" height="36" fill="#ffffff" />
    <!-- Center Vase -->
    <rect x="92" y="104" width="17" height="34" rx="2" fill="#ffffff" />
    <!-- Plant Stem -->
    <path d="M100.5,104 L100.5,52" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" />
    <!-- Leaf 1 (Left lower) -->
    <path d="M100.5,88 C88,84 86,70 100.5,66 C99.5,75 99.5,83 100.5,88 Z" fill="#ffffff" />
    <!-- Leaf 2 (Right middle) -->
    <path d="M100.5,74 C113,70 115,56 100.5,52 C101.5,61 101.5,69 100.5,74 Z" fill="#ffffff" />
    <!-- Leaf 3 (Top leaf) -->
    <path d="M100.5,52 C94,40 106,30 100.5,24 C96,30 96,44 100.5,52 Z" fill="#ffffff" />
    
    <!-- 3. RIGHT SECTION: Bookshelf & Books -->
    <!-- Top Shelf -->
    <rect x="142" y="50" width="54" height="4.5" rx="1" fill="#ffffff" />
    <!-- Bottom Shelf -->
    <rect x="142" y="96" width="54" height="4.5" rx="1" fill="#ffffff" />
    <!-- Shelf Side Support -->
    <rect x="142" y="50" width="4.5" height="50.5" fill="#ffffff" />
    <!-- Book 1 (Vertical) -->
    <rect x="153" y="60" width="6.5" height="36" rx="1" fill="#ffffff" />
    <!-- Book 2 (Vertical) -->
    <rect x="162" y="58" width="6.5" height="38" rx="1" fill="#ffffff" />
    <!-- Book 3 (Vertical) -->
    <rect x="171" y="59" width="6.5" height="37" rx="1" fill="#ffffff" />
    <!-- Book 4 (Leaning) -->
    <polygon points="180,96 189,64 195.5,66 187.5,96" fill="#ffffff" />
  </g>
  
  <!-- Outer subtle border for premium finish -->
  <circle cx="100" cy="100" r="98" fill="none" stroke="rgba(0,0,0,0.06)" stroke-width="2" />
</svg>
